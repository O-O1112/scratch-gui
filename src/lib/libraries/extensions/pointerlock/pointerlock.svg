<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 372" width="600" height="372">
  <defs>
    <linearGradient id="bgLock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E"/>
      <stop offset="50%" stop-color="#115E59"/>
      <stop offset="100%" stop-color="#021C1B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="372" rx="16" fill="url(#bgLock)"/>

  <!-- Crosshairs / Target -->
  <g transform="translate(360, 190)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#2DD4BF" stroke-width="2.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-dasharray="6,4"/>
    <circle cx="0" cy="0" r="6" fill="#5EEAD4"/>
    <!-- Cross lines -->
    <line x1="-90" y1="0" x2="-30" y2="0" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="0" x2="90" y2="0" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="-90" x2="0" y2="-30" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="30" x2="0" y2="90" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round"/>

    <!-- Lock icon in center -->
    <rect x="-14" y="-8" width="28" height="24" rx="4" fill="#0D9488" stroke="#CCFBF1" stroke-width="2"/>
    <path d="M -8,-8 L -8,-16 Q -8,-24 0,-24 Q 8,-24 8,-16 L 8,-8" fill="none" stroke="#CCFBF1" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Mouse Pointer -->
  <g transform="translate(180, 200)">
    <path d="M 0,0 L 25,60 L 10,55 L 2,75 L -10,70 L -2,50 L -18,50 Z" fill="#F0FDFA" stroke="#0F766E" stroke-width="2.5"/>
  </g>

  <text x="50" y="70" fill="#F0FDFA" font-family="sans-serif" font-size="30" font-weight="900" letter-spacing="1">滑鼠指針鎖定</text>
  <text x="50" y="100" fill="#2DD4BF" font-family="sans-serif" font-size="16" font-weight="bold">Pointer Lock API (FPS / 3D Look)</text>
</svg>
