<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 372" width="600" height="372">
  <defs>
    <linearGradient id="blockBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>
  <rect width="600" height="372" rx="16" fill="url(#blockBg)"/>
  
  <!-- Subtle decorative background frame -->
  <rect x="30" y="30" width="540" height="312" rx="12" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6"/>
  
  <!-- Geometric Block "B" Logo -->
  <g transform="translate(60, 86) scale(2)">
    <rect x="25" y="20" width="15" height="60" fill="#FFFFFF"/>
    <polygon points="45,20 70,20 75,32.5 70,45 45,45" fill="#FFFFFF"/>
    <polygon points="45,55 75,55 80,67.5 75,80 45,80" fill="#FFFFFF"/>
    <!-- Plus symbol in glowing accent -->
    <rect x="85" y="45" width="16" height="4" fill="#38BDF8" rx="2"/>
    <rect x="91" y="39" width="4" height="16" fill="#38BDF8" rx="2"/>
  </g>
  
  <!-- Title & Subtitle -->
  <text x="270" y="150" fill="#FFFFFF" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="1">BLOCK PLUS</text>
  <text x="270" y="185" fill="url(#accentGlow)" font-family="monospace" font-size="16" font-weight="700">POLYGLOT RUNTIME ENGINE</text>
  <text x="270" y="225" fill="#94A3B8" font-family="monospace" font-size="14">One File. Every Runtime.</text>
  
  <!-- Language Tags Pills -->
  <g transform="translate(270, 248)">
    <rect x="0" y="0" width="60" height="24" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="30" y="16" fill="#38BDF8" font-family="monospace" font-size="12" text-anchor="middle" font-weight="700">BLOCK</text>
    
    <rect x="68" y="0" width="44" height="24" rx="6" fill="#1E293B" stroke="#FACC15" stroke-width="1"/>
    <text x="90" y="16" fill="#FACC15" font-family="monospace" font-size="12" text-anchor="middle" font-weight="700">JS</text>
    
    <rect x="120" y="0" width="62" height="24" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="151" y="16" fill="#38BDF8" font-family="monospace" font-size="12" text-anchor="middle" font-weight="700">PYTHON</text>
    
    <rect x="190" y="0" width="50" height="24" rx="6" fill="#1E293B" stroke="#A855F7" stroke-width="1"/>
    <text x="215" y="16" fill="#A855F7" font-family="monospace" font-size="12" text-anchor="middle" font-weight="700">SQL</text>
  </g>
</svg>
