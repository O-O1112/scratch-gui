<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 372" width="600" height="372">
  <defs>
    <linearGradient id="bgAudio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1065"/>
      <stop offset="50%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#0F061E"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
  </defs>
  <rect width="600" height="372" rx="16" fill="url(#bgAudio)"/>

  <!-- Frequency Spectrum Bars -->
  <g fill="#A855F7" opacity="0.4">
    <rect x="100" y="270" width="12" height="30" rx="3"/>
    <rect x="124" y="240" width="12" height="60" rx="3"/>
    <rect x="148" y="210" width="12" height="90" rx="3"/>
    <rect x="172" y="250" width="12" height="50" rx="3"/>
    <rect x="196" y="190" width="12" height="110" rx="3"/>
    <rect x="220" y="160" width="12" height="140" rx="3"/>
    <rect x="244" y="180" width="12" height="120" rx="3"/>
    <rect x="268" y="220" width="12" height="80" rx="3"/>
    <rect x="292" y="150" width="12" height="150" rx="3" fill="#C084FC"/>
    <rect x="316" y="170" width="12" height="130" rx="3" fill="#C084FC"/>
    <rect x="340" y="200" width="12" height="100" rx="3"/>
    <rect x="364" y="230" width="12" height="70" rx="3"/>
    <rect x="388" y="190" width="12" height="110" rx="3"/>
    <rect x="412" y="160" width="12" height="140" rx="3"/>
    <rect x="436" y="210" width="12" height="90" rx="3"/>
    <rect x="460" y="240" width="12" height="60" rx="3"/>
    <rect x="484" y="270" width="12" height="30" rx="3"/>
  </g>

  <!-- 8-Bit Square & Sine Wave overlay -->
  <path d="M 60,220 L 140,220 L 140,160 L 220,160 L 220,220 L 300,220" fill="none" stroke="#F472B6" stroke-width="4" stroke-linecap="round"/>
  <path d="M 300,220 Q 345,140 390,220 T 480,220 T 540,220" fill="none" stroke="url(#waveGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- Audio speaker / note symbol -->
  <g transform="translate(490, 80) scale(1.3)">
    <circle cx="0" cy="0" r="16" fill="#8B5CF6" opacity="0.3"/>
    <path d="M -6,-2 L -2,-2 L 4,-6 L 4,6 L -2,2 L -6,2 Z" fill="#E9D5FF"/>
    <path d="M 7,-4 Q 11,0 7,4" fill="none" stroke="#E9D5FF" stroke-width="2" stroke-linecap="round"/>
    <path d="M 10,-8 Q 16,0 10,8" fill="none" stroke="#E9D5FF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text x="50" y="75" fill="#FAF5FF" font-family="sans-serif" font-size="32" font-weight="900" letter-spacing="1">進階音訊合成</text>
  <text x="50" y="105" fill="#C084FC" font-family="sans-serif" font-size="16" font-weight="bold">Web Audio &amp; Synthesizer Engine</text>
</svg>
