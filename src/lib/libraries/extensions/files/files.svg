<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 372" width="600" height="372">
  <defs>
    <linearGradient id="bgFiles" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C4A6E"/>
      <stop offset="50%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#082F49"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
  </defs>
  <rect width="600" height="372" rx="16" fill="url(#bgFiles)"/>

  <!-- Clipboard Board -->
  <rect x="180" y="140" width="130" height="170" rx="12" fill="#0284C7" stroke="#38BDF8" stroke-width="2"/>
  <rect x="220" y="125" width="50" height="25" rx="6" fill="#38BDF8"/>
  <circle cx="245" cy="133" r="4" fill="#0C4A6E"/>

  <!-- Document Sheet -->
  <rect x="195" y="160" width="100" height="135" rx="6" fill="url(#docGrad)"/>
  <line x1="210" y1="180" x2="270" y2="180" stroke="#0284C7" stroke-width="3" stroke-linecap="round"/>
  <line x1="210" y1="200" x2="280" y2="200" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  <line x1="210" y1="220" x2="260" y2="220" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  <line x1="210" y1="240" x2="275" y2="240" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  <line x1="210" y1="260" x2="250" y2="260" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>

  <!-- Disk / Download Arrow -->
  <g transform="translate(380, 200)">
    <circle cx="40" cy="40" r="55" fill="#0284C7" stroke="#7DD3FC" stroke-width="3"/>
    <!-- Arrow down -->
    <path d="M 40,15 L 40,55" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <polygon points="25,50 40,68 55,50" fill="#FFFFFF"/>
    <!-- Tray -->
    <path d="M 20,70 L 60,70" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  </g>

  <text x="50" y="75" fill="#F0F9FF" font-family="sans-serif" font-size="32" font-weight="900" letter-spacing="1">檔案與剪貼簿</text>
  <text x="50" y="105" fill="#7DD3FC" font-family="sans-serif" font-size="16" font-weight="bold">Files, Save Data &amp; Clipboard API</text>
</svg>
